# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Parallel project execution + configuration cache for faster CI builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure.
android.useAndroidX=true
# Only keep the R class for the module that declares the resource.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official
